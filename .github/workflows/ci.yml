name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux-tests:
    name: Linux — unit tests, relay tests, e2e smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libenet-dev libspdlog-dev libfmt-dev nlohmann-json3-dev
      - run: pip install pytest pytest-asyncio
      - run: python3 tools/scripts/validate_offsets.py data/offsets.json
      - run: scripts/build-linux.sh
      - run: scripts/e2e-local.sh 6

  mingw-cross:
    name: Windows binaries + DSCoopSetup.exe via mingw-w64, installer tested under Wine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build mingw-w64 libspdlog-dev libfmt-dev nlohmann-json3-dev wine64
      - run: scripts/build-mingw.sh
      - name: Installer scenarios under Wine
        run: scripts/test-installer-wine.sh build/mingw-cross/bin/DSCoopSetup.exe
      - name: Upload DSCoopSetup.exe (what players download)
        uses: actions/upload-artifact@v4
        with:
          name: DSCoopSetup-${{ github.sha }}
          path: build/mingw-cross/bin/DSCoopSetup.exe
      - name: Upload loose binaries (developers)
        uses: actions/upload-artifact@v4
        with:
          name: dscoop-mingw-${{ github.sha }}
          path: |
            build/mingw-cross/bin/version.dll
            build/mingw-cross/bin/dscoop/plugins/DSCoop.dll
            build/mingw-cross/bin/dscoop_testclient.exe
            data/offsets.json

  windows-msvc:
    name: Windows — MSVC + vcpkg (release build)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      # Own vcpkg checkout: the runner's VS-bundled vcpkg needs a baseline we do not pin in the repo.
      # x-update-baseline writes the checkout's HEAD into vcpkg.json for this run only.
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg-dscoop
          C:\vcpkg-dscoop\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg-dscoop\vcpkg.exe x-update-baseline --add-initial-baseline
          "VCPKG_ROOT=C:\vcpkg-dscoop" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: Test
        run: ctest --preset windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: dscoop-windows-${{ github.sha }}
          path: |
            build/windows-msvc/bin/version.dll
            build/windows-msvc/bin/dscoop/plugins/DSCoop.dll
            build/windows-msvc/bin/dscoop_testclient.exe
            build/windows-msvc/bin/DSCoopSetup.exe
            data/offsets.json
